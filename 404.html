<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Redirecting…</title>
<meta name="robots" content="noindex, nofollow"><script>
(function () {
  var segs = location.pathname.replace("/proofkit", '').split('/').filter(Boolean);
  location.replace(segs.length ? "/proofkit" + '/' + segs[0] + '/' : "/proofkit" + '/');
})();
</script></head><body></body></html>
