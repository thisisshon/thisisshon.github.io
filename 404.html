<!doctype html>
<!-- Proofkit teamdash — STANDALONE entry for non-Astro hosts. Framework-neutral:
     just open this file (or serve it). It loads ./teamdash.css + ./teamdash.js from core/.
     The Astro build uses ../TeamDashboard.astro instead; both share this core. -->
<html lang="en" data-pk-theme="red-moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTMiIGZpbGw9IiNEQTI5MUMiIG9wYWNpdHk9Ii4yIi8+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iNy41IiBmaWxsPSIjREEyOTFDIi8+PC9zdmc+">
<title>Proofkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<!-- pre-paint floor mirrors --pk-floor (literal: paints before any stylesheet loads) -->
<style>html,body{margin:0;background:#141414}body{font-family:Outfit,system-ui,-apple-system,sans-serif}</style>
<link rel="stylesheet" href="/proofkit/core/design/tokens.css?v=24f9058039">
<link rel="stylesheet" href="/proofkit/core/design/components.css?v=24f9058039">
<link rel="stylesheet" href="/proofkit/core/card.css?v=24f9058039">
<link rel="stylesheet" href="/proofkit/core/teamdash.css?v=24f9058039">
<script>(function(){try{
  var base="/proofkit/builder";
  var p=location.pathname;
  if(p===base||p.indexOf(base+'/')!==0)return;          // a team slug — this shell is correct
  var rest=p.slice(base.length);                         // e.g. /people/alvar@example.com
  location.replace(base+'/?pk='+encodeURIComponent(rest)+location.hash);
}catch(e){}})();</script></head>
<body>
<!-- Non-Astro host: the Worker base URL. Precedence:
       1. ?worker=<url>   connect to that Worker and REMEMBER it (survives navigation)
       2. ?worker=        (empty) forget it and go back to demo mode
       3. localStorage    whatever a previous ?worker= stored
       4. ''              demo/LOCAL mode — self-contained, no Worker required
     Opening this file in a fresh browser still lands on (4), so the "works fully with no
     Worker" property holds; connecting is an explicit, reversible act by the operator. -->
<script>
(function () {
  // Hosted build: default to this deployment's Worker. ?worker=<url> still overrides and is
  // remembered; ?worker= (empty) falls back to the baked default rather than to demo mode.
  var DEFAULT = "https://api.proofkit.in";
  var q = null;
  try { q = new URLSearchParams(location.search).get('worker'); } catch (e) {}
  if (q !== null) {
    try { q ? localStorage.setItem('pkWorkerUrl', q) : localStorage.removeItem('pkWorkerUrl'); } catch (e) {}
  }
  var u = q;
  if (!u) { try { u = localStorage.getItem('pkWorkerUrl') || ''; } catch (e) { u = ''; } }
  window.PROOFKIT_WORKER_URL = u || DEFAULT;
})();
</script>
<section class="tmd">
  <div class="pk-app" data-enter>
    <!-- Top header: title + brand-prefixed subtitle (left), brand + actions (right) -->
    <header class="pk-top">
      <div class="pk-top-l">
        <h1 class="pk-h1">Team</h1>
        <span class="tmd-tag-team" id="tmd-tag-team" hidden></span>
        <p class="pk-lead">Track your team's tickets end-to-end — open with Builder or reopened for you to clarify and resubmit.</p>
      </div>
      <div class="pk-top-r">
        <div class="pk-brand">
          <span class="pk-mark" aria-hidden="true"></span>
          <span class="pk-word">Proofkit</span>
        </div>
        <div class="pk-actions">
          <!-- One board per project this team works on. Empty and inert until there IS more than
               one — a selector whose every option produces the same screen is furniture. -->
          <div id="tmd-projscope"></div>
          <button id="tmd-refresh" class="pk-btn pk-btn--md pk-btn--ghost pk-refresh" type="button" aria-label="Refresh">
            <span class="tmd-refresh-ico">
              <svg class="ico-sync" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </span><span class="pk-refresh-label">Refresh</span>
          </button>
          <button id="tmd-logout" class="pk-btn pk-btn--md pk-btn--ghost pk-btn--icon pk-logout" type="button" aria-label="Log out" title="Log out">
            <svg class="pk-logout-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="pk-logout-door" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path class="pk-logout-out" d="M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Stat tiles: they moved INTO the content column (below), where the Builder board keeps
         them. Above the shell they were page-wide chrome that pushed the rail down by their own
         height, so the nav started a third of the way down the screen while Builder's started at
         the top edge. -->

    <div class="pk-shell">
      <!-- The rail carries no wordmark. The Builder's does not either: under [data-pk-newui] the
           header's .pk-brand is hidden and nothing replaced it, so a brand block here was the one
           thing standing between the nav and the top of the page. -->
      <aside class="pk-side">
        <button class="pk-nav is-active" data-view="home"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span class="pk-nav-txt">Home</span></button>
        <!-- QUEUE — a group, exactly as on the Builder board. Inbound and Outbound were a
             segmented control in the toolbar; they are two PAGES now, because a direction you
             cannot link to or come Back to is a hidden mode, not a place. Comments, Patterns and
             Insights join them: all five read the same queue, they only look at it differently.
             Notifications, My Team and Settings deliberately stay OUTSIDE — they are not views of
             the queue, and folding them in would leave the rail with a single top-level item. -->
        <button class="pk-nav pk-nav--group" data-view="queue" data-group="queue" aria-expanded="false"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="pk-nav-txt">Queue</span><svg class="pk-nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <div class="pk-subnav" data-subnav="queue"><div><span class="pk-subnav-marker" aria-hidden="true"></span><button class="pk-nav pk-nav--sub" data-view="queue" data-dir="inbound"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/></svg><span class="pk-nav-txt">Inbound</span></button><button class="pk-nav pk-nav--sub" data-view="queue" data-dir="outbound"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 14V4"/><path d="m8 8 4-4 4 4"/></svg><span class="pk-nav-txt">Outbound</span></button><button class="pk-nav pk-nav--sub" data-view="threads"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="pk-nav-txt">Comments</span><span class="pk-navbadge pk-navbadge--alert" id="tmd-badge-threads" hidden>0</span></button><button class="pk-nav pk-nav--sub" data-view="patterns"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span class="pk-nav-txt">Patterns</span></button><button class="pk-nav pk-nav--sub" data-view="insights"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span class="pk-nav-txt">Insights</span></button></div></div>
        <button class="pk-nav" data-view="notifs"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="pk-nav-txt">Notifications</span><span class="pk-navbadge pk-navbadge--alert" id="tmd-navbadge" hidden>0</span></button>
        <button class="pk-nav" data-view="team"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg><span class="pk-nav-txt">My Team</span></button>
        <button class="pk-nav" data-view="settings"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="pk-nav-txt">Settings</span></button>
        <!-- Grows to push the rail's foot group down; on short viewports it collapses to its 40px
             floor and the rail scrolls instead. It sits ABOVE the Collapse row, as on Builder, so
             that row travels with the hairline underneath it rather than staying pinned under the
             nav — where it read as a seventh destination. -->
        <div class="pk-side-spacer" aria-hidden="true"></div>
        <button class="pk-side-collapse" type="button" data-pk-collapse aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span class="pk-nav-txt">Collapse Menu</span></button>
        <!-- Rail actions: colour mode, then Log out — the same pair, and the same box, as Builder's. -->
        <div class="tmd-sideactions">
          <span class="tmd-sidetheme" data-pk-sidetheme></span>
          <button class="pk-side-logout pk-side-logout--row" type="button" data-pk-sidelogout aria-label="Log out" title="Log out">
            <span>Log Out</span>
            <!-- Mirrored glyph: door on the right, arrow exiting LEFT (the rail's own direction).
                 Same .pk-logout-ico hooks as the header's, so it gets the same hover exit. -->
            <svg class="pk-logout-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="pk-logout-door" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path class="pk-logout-out" d="M8 17l-5-5 5-5M3 12h12"/>
            </svg>
          </button>
        </div>
      </aside>

      <div class="pk-content">
        <!-- Queue metrics: part of the CONTENT column, not chrome above the rail. -->
        <div class="pk-bar">
          <div class="pk-counts" id="tmd-counts"></div>
        </div>
        <!-- Shared control bar — Search · Sort · By Page · primary — same position on ALL three tabs -->
        <div id="tmd-controls">
          <div class="pk-toolbar">
            <!-- The in-page Inbound/Outbound segmented control is gone. Direction is chosen in the
                 rail now, where the two are pages; carrying the same switch twice invited the pair
                 to disagree about which one you were on. -->
            <input id="tmd-search" class="pk-search" type="search" placeholder="Search comments, pages, reviewers…" autocomplete="off" spellcheck="false" />
            <div id="tmd-sort-mount"></div>
            <button class="pk-tbtn" id="tmd-bypage" type="button">By Page</button>
            <span class="pk-toolbar-sp"></span>
            <div class="pk-seg tmd-denstoggle" id="tmd-denstoggle" role="tablist" aria-label="Layout density">
              <button class="pk-segbtn is-active" type="button" data-den="cards" role="tab" aria-selected="true">Cards</button>
              <button class="pk-segbtn" type="button" data-den="table" role="tab" aria-selected="false">Table</button>
            </div>
            <button class="pk-tbtn" id="tmd-selectall" type="button">Select</button>
            <button class="pk-tbtn pk-tbtn--primary" id="tmd-primary" type="button">Clear filters</button>
          </div>
          <!-- Status filter chips (built by teamdash.js): Needs you · Open · lifecycle · overflow -->
          <div class="pk-statuschips" id="pk-statuschips" role="tablist" aria-label="Status filter"></div>
          <!-- Saved "Team views" quick-select chips (Feature 11) — shared per team -->
          <div class="pk-views" id="tmd-views" hidden></div>
          <!-- Legacy status-tab bar (retired; kept hidden for the dormant per-view renderers) + team picker -->
          <div class="pk-tabsrow">
            <div class="tmd-filters" id="tmd-filters" role="tablist" hidden></div>
            <div class="pk-teamchips" id="tmd-teamchips" hidden></div>
          </div>
          <p class="tmd-viewnote" id="tmd-viewnote" hidden></p>
        </div>

        <!-- Team Queue: everything still open (default landing) -->
        <div id="tmd-view-home" hidden></div>
        <div id="tmd-view-patterns" hidden></div>
        <div id="tmd-view-insights" hidden></div>
        <div id="tmd-view-team" hidden></div>
        <div id="tmd-view-queue" hidden></div>
        <!-- Completed: everything submitted, with its live status -->
        <div id="tmd-view-comments"><div id="tmd-list"></div></div>
        <!-- Active: tickets Builder reopened, awaiting clarify + resubmit -->
        <div id="tmd-view-delivery" hidden></div>
        <!-- Needs Clarification: items parked for clarification (raised by or directed to this team) -->
        <div id="tmd-view-clarify" hidden></div>
        <!-- Comments: every ticket-chain with a discussion thread, newest activity first -->
        <div id="tmd-view-threads" hidden></div>
        <!-- Notifications -->
        <div id="tmd-view-notifs" hidden><div id="tmd-notes"></div></div>
        <!-- Settings — personal preferences for this team member (built by teamdash.js) -->
        <!-- Bulk bar. Only the actions a team can already perform on ONE ticket: doing ten at a
             time is a speed difference, never a permission one. No Delete and no Reopen — the
             first is the Builder's, the second is the raiser's. -->
        <div class="rvd-bulk" id="tmd-bulk" hidden>
          <span class="rvd-bulk-n" id="tmd-bulk-n">0 selected</span>
          <button class="pk-bulk-a" type="button" data-act="all">Select all</button>
          <button class="pk-bulk-a" type="button" data-act="start">Start</button>
          <button class="pk-bulk-a" type="button" data-act="complete">Mark Complete</button>
          <button class="pk-bulk-a" type="button" data-act="copy">Copy prompts</button>
          <button class="pk-bulk-a" type="button" data-act="clear">Clear</button>
        </div>
        <div id="tmd-view-settings" hidden></div>

        <p id="tmd-empty" class="pk-empty" hidden>Nothing here yet.</p>
      </div>
    </div>

    <!-- Faded provision to elevate: clears the team session and opens the admin door. -->
    <footer class="tmd-foot">
      <a id="tmd-upgrade" class="tmd-upgrade" href="/proofkit/builder?login=builder">Upgrade access to admin</a>
    </footer>
  </div>
</section>
<script type="module" src="/proofkit/core/teamdash.js?v=24f9058039"></script>
</body>
</html>
