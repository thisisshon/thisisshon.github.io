name: Deploy plugins site

# This repository holds a GENERATED static bundle — there is nothing to build here, so the job
# just uploads the checkout as-is. The source lives in the private `plugins` monorepo
# (proofkit/site/build.mjs); see README.md.
#
# The previous workflows (deploy.yml, deploy-worker.yml) were removed in the same commit that
# replaced the site. deploy-worker.yml in particular auto-deployed the live `shriram-review`
# Cloudflare Worker on any change under src/plugins/proofkit/worker/** — that Worker is unrelated
# to this repo's new contents and must not be redeployed from here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages polls for 10 minutes by default and then ABORTS, cancelling a deployment
          # that was only queued rather than broken. GitHub's deployment queue has repeatedly sat
          # past that, so three consecutive deploys "failed" while the bundle itself was fine —
          # and one of those aborts left a deployment stuck in-progress, which then blocked every
          # later attempt with a 400. Wait half an hour before giving up.
          timeout: 1800000
