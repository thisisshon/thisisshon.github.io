<!doctype html>
<!-- Proofkit auth — the dedicated sign-in page.
     Exists because Chrome will not raise WebAuthn from a `chrome-extension://` origin: the popup
     hands off to this page, which runs on a normal https origin where Touch ID is allowed.
     Standalone by design — no framework, no build step. Serve it, or open it. -->
<html lang="en" data-pk-theme="red-moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in · Proofkit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTMiIGZpbGw9IiNEQTI5MUMiIG9wYWNpdHk9Ii4yIi8+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iNy41IiBmaWxsPSIjREEyOTFDIi8+PC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<!-- Black before the first stylesheet lands. This page is a hard cut away from whatever site the
     user came from, and a white flash in the middle of that cut is the one thing it must not do. -->
<style>html,body{margin:0;background:#000}</style>
<link rel="stylesheet" href="/proofkit/core/design/tokens.css?v=7d973de270">
<!-- The access-key screen is a design-system component (.pk-access*), so this page needs
     components.css. Without it the markup renders correctly and looks like nothing at all. -->
<link rel="stylesheet" href="/proofkit/core/design/components.css?v=7d973de270">
<link rel="stylesheet" href="/proofkit/core/auth.css?v=7d973de270">
</head>
<body>
<!-- Worker base URL, same precedence as the other standalone entries: ?worker=<url> remembers it,
     ?worker= forgets it, else whatever was stored. The comment lives OUT here on purpose — the
     hosted build finds this block by matching `<script>` followed directly by the IIFE, so a
     comment inside the tag makes the match fail and the page silently ships in demo mode. -->
<script>
(function () {
  // Hosted build: default to this deployment's Worker. ?worker=<url> still overrides and is
  // remembered; ?worker= (empty) falls back to the baked default rather than to demo mode.
  var DEFAULT = "https://proofkit-api.shonydjjv.workers.dev";
  var q = null;
  try { q = new URLSearchParams(location.search).get('worker'); } catch (e) {}
  if (q !== null) {
    try { q ? localStorage.setItem('pkWorkerUrl', q) : localStorage.removeItem('pkWorkerUrl'); } catch (e) {}
  }
  var u = q;
  if (!u) { try { u = localStorage.getItem('pkWorkerUrl') || ''; } catch (e) { u = ''; } }
  window.PROOFKIT_WORKER_URL = u || DEFAULT;
})();
</script>
<script type="module" src="/proofkit/core/auth.js?v=7d973de270"></script>
</body>
</html>
