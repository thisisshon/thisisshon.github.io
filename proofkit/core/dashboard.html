<!doctype html>
<!-- Proofkit dashboard — STANDALONE entry for non-Astro hosts. Framework-neutral:
     just open this file (or serve it). It loads ./dashboard.css + ./dashboard.js from core/.
     The Astro build uses ../Dashboard.astro instead; both share this core. -->
<html lang="en" data-pk-theme="red-moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTMiIGZpbGw9IiNEQTI5MUMiIG9wYWNpdHk9Ii4yIi8+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iNy41IiBmaWxsPSIjREEyOTFDIi8+PC9zdmc+">
<title>Proofkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<!-- pre-paint floor mirrors --pk-floor (literal: paints before any stylesheet loads) -->
<style>html,body{margin:0;background:#141414}body{font-family:Outfit,system-ui,-apple-system,sans-serif}</style>
<link rel="stylesheet" href="./design/tokens.css">
<link rel="stylesheet" href="./design/components.css">
<link rel="stylesheet" href="./card.css">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body>
<!-- Non-Astro host: the Worker base URL. Precedence:
       1. ?worker=<url>   connect to that Worker and REMEMBER it (survives navigation)
       2. ?worker=        (empty) forget it and go back to demo mode
       3. localStorage    whatever a previous ?worker= stored
       4. ''              demo/LOCAL mode — self-contained, no Worker required
     Opening this file in a fresh browser still lands on (4), so the "works fully with no
     Worker" property holds; connecting is an explicit, reversible act by the operator. -->
<script>
(function () {
  var q = null;
  try { q = new URLSearchParams(location.search).get('worker'); } catch (e) {}
  if (q !== null) {
    try { q ? localStorage.setItem('pkWorkerUrl', q) : localStorage.removeItem('pkWorkerUrl'); } catch (e) {}
  }
  var u = q;
  if (!u) { try { u = localStorage.getItem('pkWorkerUrl') || ''; } catch (e) { u = ''; } }
  window.PROOFKIT_WORKER_URL = u || '';
})();
</script>
<section class="rvd">
  <div class="pk-app" data-enter>
    <!-- Top header: title + lead (left), brand + actions (right) -->
    <header class="pk-top">
      <div class="pk-top-l">
        <h1 class="pk-h1"><span class="pk-h1-hi">Proof</span>kit<span class="pk-h1-mode">Builder mode</span></h1>
        <p class="pk-lead">Every ticket raised across the site, directed to you as Builder.</p>
      </div>
      <div class="pk-top-r">
        <div class="pk-brand">
          <span class="pk-mark" aria-hidden="true"></span>
          <span class="pk-word">Proofkit</span>
        </div>
        <div class="pk-actions">
          <a class="pk-btn pk-btn--md pk-btn--primary" href="/">Go to site</a>
          <button id="rvd-refresh" class="pk-btn pk-btn--md pk-btn--ghost pk-btn--icon pk-refresh" type="button" aria-label="Refresh">
            <span class="rvd-refresh-ico">
              <svg class="ico-sync" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
              <svg class="ico-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </button>
          <!-- Log out lives in the sidebar only; a second one in the header was duplicate chrome. -->
        </div>
      </div>
    </header>

    <!-- Stat tiles -->
    

    <div class="pk-shell">
      <aside class="pk-side">
<button class="pk-nav is-active" data-view="home"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="pk-nav-txt">Home</span></button><button class="pk-nav pk-nav--group" data-view="dash" data-group="queue" aria-expanded="false"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="pk-nav-txt">Queue</span><svg class="pk-nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><div class="pk-subnav" data-subnav="queue"><div><span class="pk-subnav-marker" aria-hidden="true"></span><button class="pk-nav pk-nav--sub" data-view="dash" data-dir="inbound"><span class="pk-nav-txt">Inbound</span></button><button class="pk-nav pk-nav--sub" data-view="dash" data-dir="outbound"><span class="pk-nav-txt">Outbound</span></button><button class="pk-nav pk-nav--sub" data-view="patterns"><span class="pk-nav-txt">Patterns</span></button><button class="pk-nav pk-nav--sub" data-view="insights"><span class="pk-nav-txt">Insights</span></button></div></div>
        <button class="pk-nav" data-view="notifs"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="pk-nav-txt">Notifications</span><span class="pk-navbadge pk-navbadge--alert" id="rvd-badge-notifs" hidden>0</span></button>
        <button class="pk-nav" data-view="threads"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="pk-nav-txt">Comments</span><span class="pk-navbadge" id="rvd-badge-threads" hidden>0</span></button>
        <button class="pk-nav" data-view="org"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><path d="M14 6h7M14 10h4"/><path d="M6.5 10v4a2 2 0 0 0 2 2H21"/><path d="M14 14h7M14 18h4"/></svg><span class="pk-nav-txt">Organisation</span></button>
        <button class="pk-nav" data-view="settings"><svg class="pk-nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="pk-nav-txt">Settings</span></button>
        <!-- Grows to push the rule + team picker + rail actions to the rail's foot; on short
             viewports it collapses to its 40px floor and the rail scrolls instead. -->
        <div class="pk-side-spacer" aria-hidden="true"></div>
        <button class="pk-side-collapse" type="button" data-pk-collapse aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span class="pk-nav-txt">Collapse Menu</span></button>
<div class="rvd-teamview">
          <div id="rvd-teamview-mount"></div>
        </div>
        <!-- Rail actions: colour mode, then Log out — both share the team picker's box. -->
        <div class="rvd-sideactions">
          <span class="rvd-sidetheme" data-pk-sidetheme></span>
          <button class="pk-side-logout pk-side-logout--row" type="button" data-pk-sidelogout aria-label="Log out" title="Log out">
            <span>Log Out</span>
            <!-- Mirrored glyph: door on the right, arrow exiting LEFT (the rail's own direction).
                 Same .pk-logout-ico hooks as the header's, so it gets the same hover exit. -->
            <svg class="pk-logout-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path class="pk-logout-door" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path class="pk-logout-out" d="M8 17l-5-5 5-5M3 12h12"/>
            </svg>
          </button>
        </div>
      </aside>

      <div class="pk-content">
<!-- Queue metrics: part of the CONTENT column, not chrome above the rail. -->
<div class="pk-bar">
      <div class="pk-counts" id="rvd-counts"></div>
    </div>
        <!-- Dashboard View: all current info -->
        <div id="rvd-view-home" hidden></div>
<div id="rvd-view-dash">
          <div class="pk-toolbar" id="pk-toolbar">
            <input id="rvd-search" class="pk-search" type="search" placeholder="Search comments, pages, reviewers…" autocomplete="off" spellcheck="false" />
            <div id="rvd-sort-mount"></div>
            <span class="pk-toolbar-sp"></span>
            <div class="pk-seg rvd-denstoggle" id="rvd-denstoggle" role="tablist" aria-label="Layout density">
              <button class="pk-segbtn is-active" type="button" data-den="cards" role="tab" aria-selected="true">Cards</button>
              <button class="pk-segbtn" type="button" data-den="table" role="tab" aria-selected="false">Table</button>
            </div>
            <button id="pk-selectall" class="pk-selectall" type="button">Select</button>
          </div>
          <!-- Status filter chips (built by dashboard.js): Needs you · Open · lifecycle · overflow -->
          <div class="pk-statuschips" id="pk-statuschips" role="tablist" aria-label="Status filter"></div>
          <!-- Saved "Team views" (Feature 11): quick-select filter chips, shared per key -->
          <div class="pk-views" id="rvd-views" hidden></div>
          <div class="pk-tabsrow">
            <div class="pk-tabs" id="pk-tabs" role="tablist">
              <button class="pk-tab is-active" data-tab="all">Most Recent</button>
              <button class="pk-tab" data-tab="page">By Page</button>
            </div>
            <div class="pk-teamchips" id="rvd-teamchips"></div>
          </div>
          <div id="rvd-list"></div>
        </div>

        <!-- Needs Clarification: inbound tickets parked for the raising team to clarify -->
        <div id="rvd-view-clarify" hidden></div>

        <!-- Comments: every ticket-chain with a discussion thread, newest activity first -->
        <div id="rvd-view-threads" hidden></div>

        <!-- Notifications: fired as tickets move through the status machine, newest first -->
        <div id="rvd-view-notifs" hidden></div>

        <!-- Master Log: tabular log (one row per ticket chain) + per-entry detail drill-in -->
        <div id="rvd-view-entries" hidden>
          <div id="rvd-entries"></div>
        </div>

        <!-- Insights (Feature 12): admin-only aggregate metrics + date-range picker -->
        <div id="rvd-view-insights" hidden></div>
        <div id="rvd-view-patterns" hidden></div>

        <!-- Settings: admin preferences (appearance, behavior, notifications, data, about) -->
        <div id="rvd-view-org" hidden></div>
        <div id="rvd-view-settings" hidden></div>

        <p id="rvd-empty" class="pk-empty" hidden>No comments yet.</p>
      </div>
    </div>

    <!-- bulk-select action bar (shows when ≥1 ticket is selected) -->
    <div class="rvd-bulk" id="rvd-bulk" hidden>
      <span class="rvd-bulk-n" id="rvd-bulk-n">0 selected</span>
      <button class="pk-bulk-a" type="button" data-act="all">Select all</button>
      <button class="pk-bulk-a" type="button" data-act="start">Start</button>
      <button class="pk-bulk-a" type="button" data-act="complete">Mark Complete</button>
      <button class="pk-bulk-a" type="button" data-act="reopen">Reopen</button>
      <button class="pk-bulk-a" type="button" data-act="copy">Copy prompts</button>
      <button class="pk-bulk-a" type="button" data-act="brief">Export brief</button>
      <button class="pk-bulk-a danger" type="button" data-act="delete">Delete</button>
      <button class="rvd-bulk-x" type="button" id="rvd-bulk-clear" aria-label="Clear selection">×</button>
    </div>
  </div>
</section>
<script type="module" src="./dashboard.js"></script>
</body>
</html>
